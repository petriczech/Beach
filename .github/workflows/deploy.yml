name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/match-recording-app-KVeHI
      - main
  workflow_dispatch:

# Pro publikaci do větve gh-pages je potřeba zápis do obsahu repozitáře.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Bez VITE_BASE → relativní base './', funguje na /Beach/ i /beach/.
      - run: npm run build
      # Publikuje obsah dist/ do větve gh-pages. Pages pak servírují tu větev.
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
