name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/match-recording-app-KVeHI
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Povolit jen jeden běžící deploy najednou.
# Poznámka: deploy-pages spouštěj vždy jako NOVÝ běh (push / Run workflow),
# nikdy přes „Re-run jobs" — re-run nahraje artefakt podruhé a deploy pak
# selže s „Multiple artifacts named github-pages".
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nastaví (a v případě potřeby i zapne) GitHub Pages pro tento repozitář.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repozitář je petriczech/beach → stránky běží na /beach/.
          VITE_BASE: /beach/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
